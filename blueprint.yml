# Blueprint Configuration — wip/blueprint-platform
# Created 2026-06-04. Blueprint applied to itself, productization pass.
#
# Current-state product:  the Blueprint methodology source at tools/blueprint/
#                         (+ its v1-solo self-application at wip/blueprint-redesign/)
# Proposed-state product: Blueprint as a team-adoptable, portable platform —
#                         configurable cost, org access control, bidirectional
#                         non-breaking update distribution, onboarding ramp.
#
# This EXTENDS blueprint-redesign (which ratified the v1-solo architecture in
# ADR-0001/ADR-0002 and deliberately deferred the four productization
# requirements below to "v2 / out-of-scope / Never"). Those ADRs are inherited
# verbatim — NOT re-decided. See decisions/00-charter.md.

project:
  name: "blueprint-platform"
  description: "Productize the Blueprint methodology into a team-adoptable, portable platform: configurable cost-efficiency, org-scale access control, bidirectional non-breaking update distribution, full docs, and an onboarding/enablement ramp."
  product: "Blueprint methodology"
  audience:
    leadership: []
    engineering: []
    broader:
      - "Teams adopting Blueprint across departments"
      - "Non-Nino operators running their first initiative"
      - "Org contributors filing reviewers / amendments from the field"

# ──────────────────────────────────────────────────────────────────
# Pilot profile (REQUIRED — Stage 0 → Stage 1 gate)
# Reference: tools/blueprint/template/docs/methodology/pilot-profile-template.md
# ──────────────────────────────────────────────────────────────────
pilot_profile:
  slug: "department-team-adopter"
  display_name: "Department team adopting Blueprint (multi-operator, not solo-Nino)"
  pain_point: "A team that wants to run initiatives with Blueprint cannot adopt it without re-deriving shape from a single operator's machine: paths are hardcoded, there is no cost dial, no access model, no way to receive non-breaking updates or contribute fixes back, and no onboarding ramp — so adoption stalls at 'read METHODOLOGY.md and hope.'"
  monetization_side: "operator"   # platform-owner / methodology-operator side, not the consumer product's end-user
  walkthrough_citation: "research/00-recon-synthesis.md"   # 6-agent recon, 2026-06-04; full transcript referenced therein
  competitors_in_scope:
    - "Backstage (Spotify) — internal developer platform, golden paths, plugin catalog, software catalog"
    - "Spec Kit (OpenAI) — spec-first AI engineering toolkit"
    - "Cookiecutter / Yeoman / Hygen — scaffolders (distribution shape only, no methodology/governance)"
    - "Shape Up / Linear — methodology + workflow shape"
    - "ai-hive (companion) — multi-operator coordination substrate Blueprint integrates with, does NOT absorb"
  out_of_scope_pilots:
    - "End-user of a consumer product built with Blueprint (e.g., a coach using rally-hq) — pilot of the consumer, not of Blueprint"
    - "The AI agent as pilot — agent is executor; the human team is the pilot"
    - "External commercial SaaS customer with billing/SOC2 — see scope-ceiling decision (decisions/00-charter.md § Open decision)"

# Pipeline shape — brownfield. Blueprint exists, works, ships to 6 named
# consumers, and has a deployed reference portal. We evolve it, preserving what
# works (ADR-0001/0002, the stamper, the reviewer specs, the portal chrome).
# See: tools/blueprint/docs/variant-selection.md
variant: brownfield

# Deliverable sophistication — Tier 2. Unlike blueprint-redesign (Tier 1, portal
# only), this initiative ships real new product surfaces alongside the portal:
# @blueprint/cli, executable .mjs reviewers, a versioned update channel, and a
# thin coordination control plane (pending the scope-ceiling decision).
# See: tools/blueprint/docs/portal-and-tier-ladder.md
tier: 2

# Portal pattern — BESPOKE (was A until 2026-06-06). The portal was rebuilt from
# the Pattern A audience-routed deliverables-harness into a dev-tool PRODUCT site
# (a marketing/onboarding homepage: hero + install command, pipeline, quickstart,
# command cards, /learn). That is the right shape for an ADOPTABLE product, but it
# fits neither Pattern A (stakeholder front-door to a product) nor B (redesign
# review) — it dropped the A audience switcher + 6-verb lane router. Per wave 46's
# bespoke-with-ADR escape, the divergence is recorded in decisions/02-portal-
# bespoke-product-site.md; `blueprint doctor` accepts a bespoke portal IFF that ADR
# is present (wave 48 automated this — the 2nd bespoke instance, the wave-46 trigger).
# The generic Pattern A reference stays clean in template/apps/portal for consumers.
portal_pattern: bespoke

execution:
  depth: thorough
  # thorough: this initiative defines how Blueprint ships to teams going forward;
  # full research + design-constraints + prototypes of the 4 net-new surfaces +
  # fact-check against a real second consumer + ADRs + onboarding ramp.

# Methodology version. SELF-HOSTED: as of the 2026-06-05 fold, this initiative
# lives in the methodology repo itself (tools/blueprint) as its own first
# consumer — the reference implementation. There is no external pin to track;
# the methodology and its self-application advance in the same repo, with
# template/ kept clean as the stampable substrate external consumers pull.
methodology_version: "self"   # in-repo self-application (folded 2026-06-05)

# Companion — ai-hive. Integrate, do NOT absorb (prescription: "companion stays
# separate / Never"). Blueprint owns methodology; ai-hive owns identity,
# coordination, persistence. Multi-operator + access-control build ON ai-hive's
# Worker + D1 + bearer-token substrate. See decisions/00-charter.md § Fork 1.
hive:
  enabled: false
  # The platform DESIGNS multi-operator; the platform initiative can run solo
  # initially. Flip true once the identity layer lands and a second operator joins.

cloudflare:
  enabled: true
  # Pattern B onboarding portal deploys as a Cloudflare Pages project. Any thin
  # control-plane surface (registry / update-feed / triage) reuses the ai-hive
  # Worker + D1 family, not a net-new auth/multi-tenant stack.

# ──────────────────────────────────────────────────────────────────
# Productization tracks (expanded beyond the operator's original 6 requirements;
# architect-surfaced additions marked [+]). Full rationale + gap status +
# closing pattern + reusable foundation: decisions/00-charter.md.
# ──────────────────────────────────────────────────────────────────
# A. Distribution & Versioning  — portable, bidirectional updates, [+]consumer
#                                  registry/fleet, [+]semver+deprecation, [+]contract tests
# B. Configurability & Cost      — cost dial, [+]telemetry/observability, [+]FinOps budgets
# C. Access & Governance         — access control, [+]contribution/promotion governance,
#                                  [+]security/supply-chain, [+]licensing/IP model, [+]identity
# D. Extensibility               — [+]plugin model (org-authored reviewers/stages), [+]catalog
# E. Adoption & Enablement       — documented, onboarding ramp, [+]role-based paths,
#                                  [+]support/escalation, [+]conformance certification
# F. Team / Multi-operator       — team-adoptable, ai-hive integration

# ──────────────────────────────────────────────────────────────────
# Portal harness config — read by apps/portal/src/lib/portal-config.ts.
# The Pattern A portal ships as a GENERIC shell; this block points it at
# THIS initiative's deliverables. A source left null hides its IA section
# (no Hive/state-derive substrate here — ceiling A is methodology-native).
# ──────────────────────────────────────────────────────────────────
portal:
  repo_url: "https://github.com/nino-chavez/blueprint"
  decisions:
    dir: docs/decisions            # the methodology's canonical ADR store (ADR-NNNN + numbered);
                                   #   pattern /^(?:ADR-)?(\d{4})-/ indexes them. Charter + prescription
                                   #   (2-digit) surface as explicit inspect.docs entries below.
  home:
    hero_eyebrow: Blueprint
    hero_headline: Run a product initiative end-to-end, agent-assisted.
    hero_subhead: "You bring the context — screenshots, BRDs, codebase, competitive intel. The agent runs the pipeline: research, prototype, strategy docs, fact-check, deploy — and ships one portal that serves leadership, engineering, and everyone. Team-adoptable and portable: configurable cost, git-native access, non-breaking updates."
  # Discover = the front door: what Blueprint is, how it works, why this approach,
  # and proof. Sourced from the methodology canon (README / METHODOLOGY),
  # NOT from the productization initiative's internal charter (lineage / gap-tracks /
  # scope-ceiling belong in Inspect, not on a newcomer's first screen).
  excerpts:
    - card: discover
      title: What it is
      path: README.md
      heading: What This Is
    - card: discover
      title: How it works
      path: README.md
      heading: How It Works
    - card: discover
      title: Why this approach
      path: METHODOLOGY.md
      heading: "First Principle: Agent Struggle Is a Missing Capability"
    - card: discover
      title: Evaluating for your team
      path: README.md
      heading: Evaluating Blueprint for your team?
    # The team/scale beat: hive is opt-in, off by default — this card surfaces the
    # litmus (when it's worth it), not a pitch. Spans full-width as the odd 5th card.
    - card: discover
      title: Coordinating a team
      path: docs/patterns/hive-coordination-pattern.md
      heading: When to Use Hive
  inspect:
    docs:
      - title: Charter
        description: "Origin context — how the productization was scoped: the gap analysis, the six tracks, and why scope-ceiling A (methodology-native). The why behind the decisions, not a how-to."
        path: decisions/00-charter.md
        meta: "→ decisions/00-charter.md"
      - title: Prescription
        description: "What v1 shipped — the 14-step build order, now complete — and what defers to v2."
        path: decisions/01-prescription.md
        meta: "→ decisions/01-prescription.md"
      - title: Stage 1 canonical research
        description: "Vendor-canonical + internal-impl grounding for every primitive (the ADR basis)."
        path: research/01-canonical-research.md
        meta: "→ research/01-canonical-research.md"
      - title: Recon synthesis
        description: "The 6-agent gap-analysis evidence base."
        path: research/00-recon-synthesis.md
        meta: "→ research/00-recon-synthesis.md"
      - title: Methodology amendments
        description: "Dogfooding learnings from applying Blueprint to itself; candidates for promotion."
        path: METHODOLOGY-AMENDMENTS.md
        meta: "→ METHODOLOGY-AMENDMENTS.md"
    axioms: []
  # Try embeds these as live iframes (id/label/src/note/status); Build lists them
  # as integration cards (title/description/href/meta). One entry serves both.
  surfaces:
    - id: reference-portal
      label: "The reference portal — this site"
      src: "https://blueprint-platform.pages.dev/"
      note: "This portal is itself a live Pattern A Blueprint portal, generated from its blueprint.yml — exactly what a new initiative's portal looks like. Stamp your own: npx @nino-chavez-labs/blueprint-cli init --pattern=A"
      status: ready
      title: "Reference portal (Pattern A)"
      description: "A live Blueprint Pattern A portal — this very site, generated from blueprint.yml. The canonical example of an initiative's deliverables harness."
      href: "https://blueprint-platform.pages.dev/"
      meta: "blueprint-platform.pages.dev"
  # Operate — day-to-day playbooks. The command is the actionable bit (in the
  # description); href only where the target is public (npm), so no dead links
  # while the methodology repo stays private.
  operate:
    items:
      - title: "Install / run the CLI"
        description: "npx @nino-chavez-labs/blueprint-cli — zero install. Subcommands: init · review · cost · fleet · upgrade · doctor."
        href: "https://www.npmjs.com/package/@nino-chavez-labs/blueprint-cli"
        status: Available
      - title: "Scaffold a new initiative"
        description: "npx @nino-chavez-labs/blueprint-cli init --pattern=A --target=my-initiative — stamps a portal you own, validated against the variant × tier matrix."
        status: Available
      - title: "Run a reviewer (stage gate)"
        description: "blueprint review <name> runs an executable reviewer; blueprint review --list shows canonical + org-authored reviewers."
        status: Available
      - title: "Track fleet drift · upgrade a consumer"
        description: "blueprint fleet classifies each consumer's drift from consumers.yml; blueprint upgrade bumps a consumer's methodology pin (dry-run by default)."
        status: Available
      - title: "Run conformance (doctor)"
        description: "blueprint doctor loads the config + every reviewer + runs portal conformance — the false-green guard, honest about what it didn't check."
        status: Available
      - title: "Amend the methodology"
        description: "File an amendment/RFC; the 4-bucket triage classifies it. Substantial change → RFC first; bug-fix → PR."
        status: Available
    planned:
      - title: "Multi-operator coordination"
        description: "ai-hive integration (integrate, not absorb). Flip hive.enabled once a second operator joins the initiative."
      - title: "Hosted fleet dashboard"
        description: "Deferred to v2 (scope ceiling B). v1 is git-host + npm + local files only — no hosted service."
  sources:
    build_order: apps/portal/src/data/build-order.json
    scenarios: null
    state: null
    board: null
    epic_footprints: null
    attestations: null
    proposals: null
    dep_graph: null

