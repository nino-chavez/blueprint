<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Blueprint — a methodology and CLI for running evidence-backed product initiatives with AI agents: agents execute, operators steer, gates verify.">
  <title>Blueprint — run evidence-backed product initiatives with AI agents: agents execute, operators steer, gates verify</title>
  <defs>
    <pattern id="bpgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2563eb" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="244" rx="14" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="26" y="26" width="1148" height="200" fill="url(#bpgrid)"/>

  <text x="44" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#64748b">METHODOLOGY + CLI · @nino-chavez-labs/blueprint-cli</text>

  <text x="42" y="152" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1a1a1a">Blueprint</text>
  <rect x="46" y="170" width="150" height="5" rx="2" fill="#2563eb"/>

  <text x="46" y="210" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">Run evidence-backed product initiatives with AI agents.</text>

  <!-- the triad — the thesis; the gate is the differentiator -->
  <rect x="938" y="53" width="210" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1043" y="75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569">agents execute</text>
  <rect x="938" y="101" width="210" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1043" y="123" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569">operators steer</text>
  <rect x="938" y="149" width="210" height="34" rx="17" fill="#2563eb"/>
  <text x="1043" y="171" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ffffff">gates verify</text>
</svg>
