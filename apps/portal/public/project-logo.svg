<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blueprint">
  <title>Blueprint</title>
  <!-- The mark is the product's own signature: the stage spine — nodes joined by
       a pipeline with diamond reviewer gates between them (the same glyph the
       front door and README render). Tile, gradient, grid, and drafting-paper
       roughness carry over from the prior Blueprint tile identity. -->
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6bcc"/>
      <stop offset="1" stop-color="#163f80"/>
    </linearGradient>
    <pattern id="gridpat" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.13"/>
    </pattern>
    <filter id="r1" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="r2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bp)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#gridpat)"/>
  <!-- drafting arc, kept from the prior tile: the compass sweep behind the work -->
  <g filter="url(#r2)">
    <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3.5"/>
  </g>
  <!-- the spine: research → gate → build → gate → ship, drawn on the diagonal
       (rising left-to-right — the pipeline advances) -->
  <g filter="url(#r1)">
    <line x1="13" y1="47" x2="51" y2="17" stroke="#fff" stroke-width="2.4" opacity="0.9"/>
    <!-- gates: rotated squares, hollow — work stops here until it passes -->
    <rect x="19.4" y="36.4" width="5.2" height="5.2" fill="#1a4d96" stroke="#fff" stroke-width="1.9" transform="rotate(45 22 39)"/>
    <rect x="39.4" y="21.4" width="5.2" height="5.2" fill="#1a4d96" stroke="#fff" stroke-width="1.9" transform="rotate(45 42 24)"/>
    <!-- stage nodes: filled, the artifacts that survive -->
    <circle cx="13" cy="47" r="5.8" fill="#fff"/>
    <circle cx="13" cy="47" r="2.3" fill="#1a4d96"/>
    <circle cx="32" cy="32" r="5.8" fill="#fff"/>
    <circle cx="32" cy="32" r="2.3" fill="#1a4d96"/>
    <circle cx="51" cy="17" r="5.8" fill="#fff"/>
    <circle cx="51" cy="17" r="2.3" fill="#1a4d96"/>
  </g>
</svg>
