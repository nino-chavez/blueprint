name: Release

# Publishes the Blueprint methodology distribution to npm.
# Dormant until the NPM_TOKEN secret is set. The changesets action opens a
# "Version Packages" PR when pending changesets exist; publish happens only when
# that PR merges — nothing publishes on an ordinary push.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # push the version PR + tags
  pull-requests: write  # open the version PR
  id-token: write       # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install --no-audit --no-fund
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
