name: Release

# Publishes the Blueprint methodology distribution to npm
# (@nino-chavez-labs/blueprint-cli).
#
# npm authenticates this GitHub-hosted job through a trusted publisher connection:
# owner nino-chavez, repository blueprint, workflow release.yml, no environment.
# The connection must allow direct npm publish before this workflow is merged.
# No long-lived npm token is required.
#
# The changesets action opens a "Version Packages" PR when pending changesets
# exist; with no pending changesets it runs the root package publish command.
# Trigger via workflow_dispatch or a push to main after the trust is configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # push the version PR + tags
  pull-requests: write  # open the version PR

jobs:
  # Release gates (wave 86). The npm artifact ships template/ — including the
  # stampable portal — so publish must exercise the stamped output, not just
  # doctor. Command lists live in `npm run test:core` (single source; doctor.yml
  # runs the same script). portal-health (apps/portal) deliberately does NOT
  # gate release: it is not in the npm `files` array; deploy-portal.yml owns it.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pilot reviewer's git-recency check needs real history (a depth-1 graft reads as "everything recently edited"; the reviewer also self-degrades on shallow clones)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: lib self-tests + stamp smoke (bare node, no install)
        run: npm run test:core

  template-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: stamp Pattern A fixture
        run: node template/tools/blueprint-init/stamp.mjs --mode=stamp --name=ci-fixture --display-name="CI Fixture" --tagline="template-health fixture" --portal-type=initiative --target="$RUNNER_TEMP/ci-fixture"
      - name: install stamped fixture
        run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/ci-fixture
      - name: typecheck stamped fixture
        run: npm run typecheck
        working-directory: ${{ runner.temp }}/ci-fixture
      - name: build stamped fixture
        run: npm run build
        working-directory: ${{ runner.temp }}/ci-fixture

  release:
    runs-on: ubuntu-latest
    needs: [core-tests, template-health]
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # npm trusted publishing and provenance; release job only
    steps:
      - uses: actions/checkout@v4
      # OIDC requires npm >=11.5.1; pin npm below instead of relying on Node's bundle.
      # No registry-url or token-backed .npmrc: npm obtains a short-lived OIDC token.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm for trusted publishing
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      # Publish only from a healthy tree. doctor.yml runs the same gate on every
      # push, but as a separate workflow nothing tied its result to the publish
      # path — a failing main could still ship to npm (wave 75). Dependency-free,
      # so it runs before npm install.
      - name: blueprint doctor (release gate)
        run: node bin/blueprint.mjs doctor
      - run: npm install --no-audit --no-fund
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
