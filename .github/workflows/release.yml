name: Release

# Publishes the Blueprint methodology distribution to npm
# (@nino-chavez-labs/blueprint-cli).
#
# Dormant until the BLUEPRINT_NPM_TOKEN secret is set. The secret is named
# project-specifically (NOT the generic NPM_TOKEN) so it can't clash with an
# org-level or another project's NPM_TOKEN secret; it's mapped to the NPM_TOKEN
# env var the changesets action reads (see the env: block below).
#
# The changesets action opens a "Version Packages" PR when pending changesets
# exist; with no pending changesets it runs the publish command, shipping any
# unpublished version (the first publish of 0.1.0). Trigger via workflow_dispatch
# (Actions → Release → Run workflow) once the secret is set, or any push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # push the version PR + tags
  pull-requests: write  # open the version PR
  id-token: write       # npm provenance

jobs:
  # Release gates (wave 86). The npm artifact ships template/ — including the
  # stampable portal — so publish must exercise the stamped output, not just
  # doctor. Command lists live in `npm run test:core` (single source; doctor.yml
  # runs the same script). portal-health (apps/portal) deliberately does NOT
  # gate release: it is not in the npm `files` array; deploy-portal.yml owns it.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: lib self-tests + stamp smoke (bare node, no install)
        run: npm run test:core

  template-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: stamp Pattern A fixture
        run: node template/tools/blueprint-init/stamp.mjs --mode=stamp --name=ci-fixture --display-name="CI Fixture" --tagline="template-health fixture" --portal-type=initiative --target="$RUNNER_TEMP/ci-fixture"
      - name: install stamped fixture
        run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/ci-fixture
      - name: typecheck stamped fixture
        run: npm run typecheck
        working-directory: ${{ runner.temp }}/ci-fixture
      - name: build stamped fixture
        run: npm run build
        working-directory: ${{ runner.temp }}/ci-fixture

  release:
    runs-on: ubuntu-latest
    needs: [core-tests, template-health]
    steps:
      - uses: actions/checkout@v4
      # NOTE: no `registry-url:` here on purpose. setup-node's registry-url writes
      # an .npmrc keyed on NODE_AUTH_TOKEN and pins NPM_CONFIG_USERCONFIG to it —
      # which made npm publish ANONYMOUSLY (404) because we auth via NPM_TOKEN, not
      # NODE_AUTH_TOKEN. We write the auth line explicitly below instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Publish only from a healthy tree. doctor.yml runs the same gate on every
      # push, but as a separate workflow nothing tied its result to the publish
      # path — a failing main could still ship to npm (wave 75). Dependency-free,
      # so it runs before npm install.
      - name: blueprint doctor (release gate)
        run: node bin/blueprint.mjs doctor
      - run: npm install --no-audit --no-fund
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.BLUEPRINT_NPM_TOKEN }}
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Project-scoped secret → also exposed as NPM_TOKEN for the changesets
          # action's own npm calls. The real auth is the ~/.npmrc written above.
          NPM_TOKEN: ${{ secrets.BLUEPRINT_NPM_TOKEN }}
          # Provenance is OFF: npm provenance requires a PUBLIC source repo, and
          # nino-chavez/blueprint is private — leaving it on fails the publish.
          # Re-enable (publishConfig.provenance + this var) if the repo goes public.
