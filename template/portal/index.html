<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PROJECT_NAME — Front Door</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css?v=20260611-docs">
  <link rel="stylesheet" href="/project-tokens.css?v=20260525-overlay">
  <style>
    body { background: var(--bg); }
    main.container { padding-top: var(--space-12); padding-bottom: var(--space-12); }

    /* Hero */
    .hero-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-8);
      padding: var(--space-16) 0 var(--space-4);
      flex-wrap: wrap;
    }
    .hero-lead .label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .hero-lead .label::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--brand-500);
    }
    .hero-lead h1 {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 1.5rem + 3vw, 3.75rem);
      line-height: 1.05;
      letter-spacing: -0.025em;
      font-weight: 700;
      text-transform: none;
      margin-top: var(--space-4);
      max-width: 16ch;
      color: var(--text-primary);
    }

    .hero-lede {
      max-width: 64ch;
      margin-bottom: var(--space-12);
      color: var(--text-secondary);
      font-size: var(--text-base);
      line-height: 1.65;
    }

    /* Stats — richer breakdowns */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-3);
      margin: 0 0 var(--space-12);
    }
    .stat-tile {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5) var(--space-5);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.03);
    }
    .stat-tile .stat-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-tile .stat-value {
      font-family: var(--font-mono);
      font-size: 40px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 4px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-tile .stat-value .of {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 24px;
      margin-left: 2px;
    }
    .stat-tile .stat-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: var(--space-3);
      line-height: 1.5;
    }

    /* Path cards */
    .paths-section { padding-bottom: var(--space-10); }
    .paths-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--space-4);
    }
    .path-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5) var(--space-5) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.03);
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .path-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--brand-500) 35%, var(--card-border));
      box-shadow: 0 6px 16px -4px rgb(0 0 0 / 0.08), 0 2px 4px rgb(0 0 0 / 0.04);
    }
    .path-card .icon-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .path-card .icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--brand-500) 10%, transparent);
      color: var(--brand-700);
      display: flex; align-items: center; justify-content: center;
    }
    .path-card .icon svg {
      width: 22px; height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .path-card .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      color: var(--text-muted);
    }
    .path-card .status .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .path-card .status.ready   .dot { background: hsl(142 60% 45%); }
    .path-card .status.ready   { color: hsl(142 60% 30%); }
    .path-card .status.partial .dot { background: hsl(40 95% 50%); }
    .path-card .status.partial { color: hsl(40 95% 30%); }
    .path-card .status.planned .dot { background: hsl(220 10% 60%); }

    .path-card h3 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }
    .path-card p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.55;
      margin: 0;
      flex: 1;
    }
    .path-card .links {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      line-height: 1.6;
      padding-top: var(--space-3);
      border-top: 1px dashed var(--card-border);
    }
    .path-card .links a {
      color: var(--brand-600);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--brand-500) 30%, transparent);
    }
    .path-card .links a:hover {
      color: var(--brand-700);
      border-bottom-color: var(--brand-600);
    }

    .footer-note {
      padding: var(--space-5) 0;
      margin-top: var(--space-8);
      border-top: 1px solid var(--card-border);
      font-size: var(--text-xs);
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      font-family: var(--font-mono);
    }
    .footer-note a {
      color: var(--text-secondary);
      border-bottom: 1px solid var(--card-border);
    }
    .footer-note a:hover { color: var(--text-primary); border-bottom-color: var(--text-secondary); }
  </style>
</head>
<body>
  <header data-portal-shell="index"></header>

  <main class="container">
    <!-- Wave 85: hero + tiles + paths render from _meta/index.json `front_door`
         (same manifest-driven contract as docs.tiers[] and footer). The prior
         version baked the source project's hero copy, stat tiles, and a
         five-path grid into this file — every consumer shipped another
         project's front door. Markup below carries neutral fallbacks only. -->
    <div class="hero-row">
      <div class="hero-lead">
        <span class="label" data-fd-label>Blueprint</span>
        <h1 data-fd-h1>The review package,<br/>on one shelf.</h1>
      </div>
    </div>

    <p class="hero-lede" data-fd-lede>
      Prototype pages with strategy and current-state drawers, the strategic
      documents behind them, and a chat grounded in the initiative's corpus.
    </p>

    <section class="stat-row" id="stat-row">
      <div class="stat-tile">
        <div class="stat-label">Prototype</div>
        <div class="stat-value" id="stat-pages">…</div>
        <div class="stat-sub">pages across <span id="stat-slices">…</span> slices</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Docs</div>
        <div class="stat-value" id="stat-docs">…</div>
        <div class="stat-sub">Strategic artifacts + working documents</div>
      </div>
      <!-- front_door.tiles entries append here -->
    </section>

    <section class="paths-section">
      <div class="paths-grid" id="paths-grid"></div>
    </section>

    <footer class="footer-note" id="footer-note">
      <!-- Populated from _meta/index.json `name`, `tagline`, and `repo_url`.
           Prior version had consumer project content baked in (2026-05-25
           leak). Now project-agnostic; consumer edits the manifest only. -->
      <span data-footer-line>—</span>
      <a data-footer-repo target="_blank" rel="noopener" style="display:none">github ↗</a>
    </footer>
  </main>

  <script>
    // Wave 85: everything on this page renders from _meta/index.json. The
    // prior version hardcoded a five-path grid full of the source project's
    // doc slugs, AND referenced an undeclared MANIFEST identifier — the
    // ReferenceError killed this whole script, so consumers saw frozen "…"
    // tiles, an empty grid, and a dead footer. One async flow, no globals.
    const PATH_ICONS = {
      play: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>',
      compass: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M16 8l-3 5-5 3 3-5 5-3z" fill="currentColor" stroke="none"/></svg>',
      search: '<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5l5 5"/></svg>'
    };

    // Neutral defaults when the manifest declares no front_door block: the two
    // surfaces every Review Portal has. No project content lives here.
    const DEFAULT_PATHS = [
      {
        id: 'compare', title: 'Compare', status: 'ready', icon: 'play',
        description: 'Walk the prototype pages with strategy + current-state drawers and the proposed / compare / shipped toggle.',
        links_html: 'Catalog: <a href="/prototype/">/prototype/</a>'
      },
      {
        id: 'read', title: 'Read', status: 'ready', icon: 'compass',
        description: 'The strategic documents behind the prototype — why the proposal makes its calls.',
        links_html: '<a href="/docs/">Docs shelf</a>'
      }
    ];

    function renderPaths(paths) {
      const grid = document.getElementById('paths-grid');
      grid.innerHTML = '';
      paths.forEach(p => {
        const card = document.createElement('div');
        card.className = 'path-card';
        card.innerHTML = `
          <div class="icon-row">
            <div class="icon">${PATH_ICONS[p.icon] ?? PATH_ICONS.compass}</div>
            <span class="status ${p.status ?? 'ready'}"><span class="dot"></span>${p.status ?? 'ready'}</span>
          </div>
          <h3>${p.title}</h3>
          <p>${p.description ?? ''}</p>
          <div class="links">${p.links_html ?? ''}</div>
        `;
        grid.appendChild(card);
      });
    }

    renderPaths(DEFAULT_PATHS);

    (async function () {
      try {
        const r = await fetch('/_meta/index.json');
        const m = await r.json();
        document.getElementById('stat-pages').textContent = (m.pages || []).length;
        const slicesEl = document.getElementById('stat-slices');
        if (slicesEl) slicesEl.textContent = (m.slices || []).length;
        const docsEl = document.getElementById('stat-docs');
        if (docsEl) docsEl.textContent = ((m.docs && m.docs.tiers) || [])
          .reduce((n, t) => n + ((t.docs || []).length), 0);

        // front_door block: hero copy, extra tiles, and the path grid.
        const fd = m.front_door || {};
        const setHtml = (sel, v) => { const el = document.querySelector(sel); if (el && v) el.innerHTML = v; };
        setHtml('[data-fd-label]', fd.label || (m.name ? `The ${m.name}` : null));
        setHtml('[data-fd-h1]', fd.h1 ? fd.h1.replace(/\n/g, '<br/>') : null);
        setHtml('[data-fd-lede]', fd.lede);
        if (Array.isArray(fd.tiles)) {
          const row = document.getElementById('stat-row');
          for (const t of fd.tiles) {
            const tile = document.createElement('div');
            tile.className = 'stat-tile';
            tile.innerHTML = `<div class="stat-label">${t.label ?? ''}</div><div class="stat-value">${t.value ?? ''}</div><div class="stat-sub">${t.sub ?? ''}</div>`;
            row.appendChild(tile);
          }
        }
        if (Array.isArray(fd.paths) && fd.paths.length) renderPaths(fd.paths);

        // Populate footer from manifest. footer.line falls back to tagline.
        // repo_url is optional — anchor stays hidden if absent.
        const slug = (m.name || 'Project').replace(/\s+Blueprint\s*$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const footerLine = (m.footer && m.footer.line) || m.tagline || `${slug}-blueprint`;
        const repoUrl = (m.footer && m.footer.repo_url) || m.repo_url || '';
        const lineEl = document.querySelector('[data-footer-line]');
        const repoEl = document.querySelector('[data-footer-repo]');
        if (lineEl) lineEl.textContent = footerLine;
        if (repoEl && repoUrl) {
          repoEl.href = repoUrl;
          repoEl.style.display = '';
        }
      } catch {
        document.getElementById('stat-pages').textContent = '—';
        const slicesEl = document.getElementById('stat-slices');
        if (slicesEl) slicesEl.textContent = '—';
      }
    })();
  </script>

  <script>
    // PORTAL_SHELL_CONFIG intentionally omitted — _portal-shell.js reads
    // productName from _meta/index.json `name` automatically (2026-05-25
    // refactor). The previous PROJECT_NAME placeholder pattern relied on
    // consumer-side find-and-replace; the manifest-driven path removes that
    // surface area. See template/portal/CONVENTIONS.md § "Docs viewer manifest".
    window.PROTO_PAGE = { id: 'index', title: 'Front Door' };
    window.PROTO_CHAT_DISABLED = false;
  </script>
  <script src="/_portal-shell.js?v=20260611-docs"></script>
  <script src="/proto-nav.js?v=20260611-docs"></script>
  <script src="/chat-widget.js" defer></script>
  <script src="/proto-annotate.js?v=20260611-docs" defer></script>
</body>
</html>
