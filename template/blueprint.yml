# Blueprint Configuration
# Copy this to your initiative root and customize.

project:
  name: ""                          # e.g., "Self-Service Billing Portal"
  description: ""                   # One-line description of the initiative
  product: ""                       # e.g., "Acme Commerce Platform"
  audience:
    leadership: []                  # e.g., ["Daniel Lentz", "Austin Comer"]
    engineering: []                 # e.g., ["platform team"]
    broader: []                     # e.g., ["All stakeholders"]

# What kind of product this is — gates the terminology-linter's jargon rules
# (wave 77). For a dev tool, 'endpoint'/'schema'/'payload' are legitimate
# domain vocabulary, not leaked jargon. Leave empty for end-user products.
product_type: ""                    # e.g., "dev-tool" | "api" | "sdk" | "cli"

# Terminology / glossary posture (wave 77). Default (empty): the linter
# expects a glossary at docs/terminology.md (or a "User terminology" section
# in prototype/DESIGN.md) once the initiative is >3 days old. Set to "none"
# for a no-glossary repo — jargon is handled by copy rewrites or
# define-on-first-use inline; the missing-glossary WARN retires.
terminology:
  glossary: ""                      # "" (expect a glossary) | "none"

# ──────────────────────────────────────────────────────────────────
# Pilot profile (REQUIRED — Stage 0 → Stage 1 gate)
# Reference: docs/methodology/pilot-profile-template.md
# Reviewer:  pilot-profile-lock-reviewer (blocks Stage 1 until this is filled)
# ──────────────────────────────────────────────────────────────────
#
# Why this is required: on 2026-05-22 (rally-hq vs-volleyballlife walkthrough)
# an initiative drifted from its declared pilot ("competitive scan against
# vs-volleyballlife") to a different pilot ("Let's Pepper feature comparison")
# without the operator noticing — because the original pilot was never locked
# in a structured field. Stage 1 research went deep on the wrong target.
#
# The lock prevents implicit pilot substitution. Stage 1 research must derive
# from this profile; any pivot to a different pilot requires an explicit ADR.
pilot_profile_policy: required     # stage machine + reviewer both block until the profile fills (wave 86)
pilot_profile:
  slug: ""                          # short id, e.g., "tournament-organizer"
  display_name: ""                  # e.g., "Tournament Organizer (regional, multi-court)"
  pain_point: ""                    # one-sentence specific pain this initiative addresses
  monetization_side: ""             # player | coach | organizer | buyer | seller | operator | (other — name it)
  walkthrough_citation: ""          # path to a real artifact: interview transcript, competitive
                                    # walkthrough doc, observation notes, screenshot set. NOT
                                    # "I imagined this user." A real artifact you can cite.
  competitors_in_scope: []          # competitors derived FROM this pilot, not arbitrary picks
                                    # e.g., ["VolleyballLife.com", "AdvancedEventSystems", "Let's Pepper"]
  out_of_scope_pilots: []           # other pilots the initiative could have targeted but won't
                                    # naming them prevents accidental drift
                                    # e.g., ["Player searching for team", "Coach managing roster"]

# ──────────────────────────────────────────────────────────────────
# Design intent (judged-screen-pattern.md § 2a — PROMOTION CANDIDATE)
# How much design work this change is. The intent decides what Stage 2
# owes, so that a one-line copy fix does not owe a concept exercise and a
# genuine redesign cannot skip one.
#   preserve = the approved direction stands; this change works inside it.
#              Requires design_direction below. No brief, no concepts.
#   refit    = change the presentation, preserve the named behavior.
#              Requires prototype/EXPERIENCE-BRIEF.md. No concepts.
#   rethink  = the direction itself is the question. Requires the brief,
#              3 divergent whole-screen concepts, and a selection ADR that
#              names the human who chose.
# Undeclared is NOT preserve — it WARNs. Defaulting silently to the
# cheapest intent would let any change opt out by saying nothing.
# Reviewers: design-principles-reviewer (checks 10/11),
#            screen-composition-reviewer (which reviews are required).
# ──────────────────────────────────────────────────────────────────
design_intent: ""                   # preserve | refit | rethink
design_direction: ""                # REQUIRED when design_intent: preserve —
                                    # repo-relative path to the approved direction
                                    # record (a DIRECTION.md or a decisions/ ADR).
                                    # The file must exist; a pointer to a deleted
                                    # record is the drift this catches.

# Screen-review policy (judged-screen-pattern.md — PROMOTION CANDIDATE)
# screen-composition-reviewer is WARN by default while the pattern is a
# promotion candidate. Declare `strict` to make its findings BLOCK.
# This is a declared scalar, not a CLI flag: `blueprint review` forwards no
# argv to a reviewer, so --strict could never arrive.
screen_review_policy: ""            # "" (warn) | strict

# Execution depth
execution:
  depth: standard                   # lean | standard | thorough
  # lean:     Research + prototype + 1 strategy doc. Fast alignment.
  # standard: Research + prototype + strategy + feasibility docs. Full pipeline.
  # thorough: All of standard + market comparables + integration plan + AI chat + codebase validation.

# ──────────────────────────────────────────────────────────────────
# Cost / effort dial (ADR-0003) — orthogonal to execution.depth.
#   execution.depth answers "how many docs."  cost answers "how hard each
#   stage thinks + which model runs it."  Resolved by tools/lib/cost-dial.mjs.
# Reference: docs/patterns/tiered-orchestration-pattern.md (the Opus/Sonnet ladder),
#            ADR-0003-cost-effort-dial.md
# ──────────────────────────────────────────────────────────────────
#
# effort     uses Claude Code's enum VERBATIM: low | medium | high | xhigh | max
#            (the operator named that exact dial; do not invent a custom scale).
# model_tier opus | sonnet | haiku | inherit. `inherit` = use the session model.
#
# The per-stage anchors below are PROVISIONAL — seeded from the tiered-
# orchestration ladder (Orchestrator/arbitration = opus high; Implementer = sonnet
# high; verification = opus xhigh; mechanical = sonnet low). They are NOT
# calibrated. Re-anchor from .blueprint/telemetry.jsonl after ~10 cycles and record
# the recalibration as a methodology amendment. Never ship telemetry-free numbers as
# settled truth.
#
# Skip-justification gate (step 6): if a stage's RESOLVED effort/model_tier falls
# BELOW its anchored default and no `skip_justification:` string is present, the
# cost gate emits a BLOCK finding (charter risk #3 — under-processing must be a
# recorded conscious choice, not a silent default).
cost:
  default:
    effort: medium                  # applied to any stage not named below
    model_tier: inherit
  stages:
    research:    { effort: high,  model_tier: opus }                                 # arbitration-heavy (Orchestrator)
    design:      { effort: high,  model_tier: opus }                                 # constraint/fork resolution (Specialist)
    prototype:   { effort: high,  model_tier: sonnet }                               # TDD implementation (Implementer)
    fact_check:  { effort: xhigh, model_tier: opus }                                 # false-green guard (Specialist verify)
    documents:   { effort: medium, model_tier: sonnet }                              # doc generation (Implementer)
    deploy:      { effort: low,   model_tier: sonnet, skip_justification: "mechanical" }
    iterate:     { effort: medium, model_tier: sonnet }                              # amendment harvest / review (Janitor)

# ──────────────────────────────────────────────────────────────────
# Access & governance (ADR-0004) — INTENT only; the git host ENFORCES.
#   Blueprint owns no identity service (scope ceiling A). These four roles map to
#   git-host TEAM names + GitHub built-in repo roles; enforcement is 100% the
#   host's (team membership + CODEOWNERS + the `main` ruleset).
# Reference: ADR-0004-native-access-governance.md, CONTRIBUTING.md,
#            docs/governance/ (CODEOWNERS + main-ruleset.json + apply-ruleset.sh)
# ──────────────────────────────────────────────────────────────────
#
# repo_role is the GitHub built-in role the host grants the team: admin | write |
# triage | read. team is the git-host team handle (or a user handle on a personal
# repo — then the model only BINDS once the team grows past one; see CODEOWNERS).
# Leave teams empty until the repo is org-owned; an empty block is inert (no
# enforcement is derived from this file — it documents intent the operator wires
# in the host).
access:
  roles:
    admin:       { team: "",  repo_role: admin }    # owns promotion: METHODOLOGY.md, docs/, template/, *AMENDMENTS* (CODEOWNERS)
    contributor: { team: "",  repo_role: write }    # opens PRs/RFCs from the field (the UP channel)
    reviewer:    { team: "",  repo_role: triage }   # triages amendment/RFC issues; no merge rights
    stakeholder: { team: "",  repo_role: read }     # reads the portal + docs; no write

# ──────────────────────────────────────────────────────────────────
# Optional dependencies
# Blueprint works standalone. These tools extend it.
# ──────────────────────────────────────────────────────────────────

# Forge Signal — strategic content generation with voice taxonomy
# Install: git clone git@github.com:nino-chavez/forge-signal.git && cd forge-signal && npm install
# Docs: https://github.com/nino-chavez/forge-signal
signal_forge:
  enabled: false                    # set true if forge-signal is available
  path: ""                          # e.g., "~/Workspace/dev/tools/forge-signal"
  # When enabled:
  #   - /blueprint-docs can use forge-signal's generate command for thought-leadership voice
  #   - Voice guides at forge-signal/docs/voice/ are the canonical reference
  #   - Document quality audit at forge-signal/docs/voice/document-quality-audit.md

# Specchain — spec-driven development with multi-agent orchestration
# Install: git clone git@github.com:nino-chavez/specchain.git && cd specchain && bash setup.sh
# Docs: https://github.com/nino-chavez/specchain
specchain:
  enabled: false                    # set true if specchain is installed in this project
  # When enabled:
  #   - /blueprint-prototype can hand off to specchain for implementation specs
  #   - Governance principles from specchain/governance/principles.md apply
  #   - STATE.md session tracking pattern is available
  #   - Squad mode agents can parallelize research tasks

# ──────────────────────────────────────────────────────────────────
# Platform B2B edition — opt-in for B2B-targeted initiatives
# Reference: the private platform B2B context packs (supplied per engagement)
# ──────────────────────────────────────────────────────────────────

b2b_edition:
  enabled: false                    # set true if initiative targets BC B2B Edition
  # When enabled:
  #   - Stage 1 research auto-includes both BC B2B reference docs in research/current-state/
  #   - prototype/DESIGN.md "When Targeting BC B2B Edition" section is authoritative
  #   - CLAUDE.md adds B2B-specific anti-patterns and reading order
  #   - Strategy panels must cite Buyer Portal contract methods (loginWithB2B, useAddToQuote, on-cart-created, etc.)
  buyer_portal_strategy: bc_cdn     # bc_cdn | fork | host_owned
  # bc_cdn:     Use BC's hosted Buyer Portal SPA (default, zero infra)
  # fork:       Fork the platform's open-source buyer portal, self-host (when surface customization is unavoidable)
  # host_owned: Implement Buyer-Portal-equivalent surfaces in your host storefront (rare; usually overkill)

# ──────────────────────────────────────────────────────────────────
# Hive multi-agent coordination — opt-in
# Reference: docs/patterns/hive-coordination-pattern.md
# ──────────────────────────────────────────────────────────────────

hive:
  enabled: false                    # set true to coordinate via a Hive companion
  # Blueprint integrates with Hive through its MCP TOOL CONTRACT — substrate-agnostic.
  # ANY Hive exposing the hive_* coordination tools satisfies it, regardless of host.
  # Blueprint owns methodology; Hive owns coordination/persistence — integrate, not absorb.
  # The contract + tool list: docs/methodology/hive-integration-contract.md.
  mcp_endpoint: ""                  # the Hive MCP server URL (ANY host) — the only required wiring
  # Host-specific — fill ONLY if you self-host the CF Worker + D1 reference impl:
  source: ""                        # e.g., "~/Workspace/dev/wip/blueprint-example/.hive"
  mcp_server: ""                    # e.g., "myproject-hive-mcp"
  dashboard: ""                     # e.g., "myproject-hive-dashboard"
  cf_account: ""                    # CF account binding (named profile or account ID)
  d1_database: ""                   # e.g., "myproject-hive-d1"
  # Use when:
  #   - 5+ parallelizable work streams
  #   - Multiple agent sessions running concurrently against the same repo
  #   - Timeline too short for serialized work (<2 weeks)
  # Skip when:
  #   - Solo, sequential initiative — TaskCreate is sufficient
  #   - Throwaway exploration

# ──────────────────────────────────────────────────────────────────
# Cloudflare deployment — opt-in (replaces default Vercel target)
# Reference: docs/patterns/cloudflare-deployment-pattern.md
# ──────────────────────────────────────────────────────────────────

cloudflare:
  enabled: false                    # set true to deploy on Cloudflare instead of Vercel
  # When enabled:
  #   - Stage 6 deploy uses `wrangler deploy` / `wrangler pages deploy`
  #   - Stage 1 research auto-includes cloudflare-deployment-pattern.md
  #   - ADR-0004 pattern (CF infrastructure inventory) is mandatory before code is written
  account_strategy: single          # single | per_environment
  # single:          One CF account, multiple envs via wrangler [env.*] (fastest setup)
  # per_environment: Separate CF accounts per env (production isolation)
  primitives:                       # Which CF primitives the initiative will use
    workers: true
    pages: true
    d1: false
    workers_ai: false
    vectorize: false
    kv: false
    r2: false
    queues: false
    durable_objects: false

# ──────────────────────────────────────────────────────────────────
# OWNER-SPEC pattern — durable expert knowledge on substrate tools
# Reference: ~/Workspace/dev/tools/blueprint/docs/patterns/owner-spec-pattern.md
# Implementation: template/tools/owner-spec-lint/ + template/docs/methodology/owner-spec-convention.md
# ──────────────────────────────────────────────────────────────────

owner_spec:
  enabled: false                    # set true to inherit the OWNER-SPEC convention + freshness lint
  # Use when:
  #   - Project has >3 substrate tools (derive scripts, lint tools, dashboards, ingesters)
  #   - Multi-session / multi-agent work expected (future sessions need rationale)
  #   - Tools accumulate design decisions that aren't obvious from code
  #   - You plan to build skill-mediated expert agents at any point
  # Skip when:
  #   - Project has only trivial scripts (<50 LOC each, fully README-documented)
  #   - One-shot prototype with no substrate tools
  #   - You're OK with re-deriving tool design rationale six months from now

# ──────────────────────────────────────────────────────────────────
# Archaeology substrate — opt-in (recommended for >2-week initiatives)
# Reference: docs/patterns/archaeology-substrate-pattern.md
# Implementation: template/tools/archaeology/  (scaffold.sh provisions everything)
# ──────────────────────────────────────────────────────────────────

archaeology:
  enabled: false                    # set true to bootstrap the substrate at project init
  project_slug: ""                  # short name; used in CF resource names (e.g. "subs", "askbc")
  project_id: ""                    # full project id; usually matches `project.name`
  # Use when:
  #   - Initiative will run more than a few weeks (history accumulates)
  #   - Multi-agent / multi-session work expected (sessions are highest-value stream)
  #   - Onboarding new engineers periodically (the substrate turns "write a handoff doc" into "run a query")
  #   - You want exhaustive provenance queryable as evidence (due-diligence framing)
  # Skip when:
  #   - Throwaway prototype that won't outlive the week
  #   - Solo, single-session work with no Hive or multi-agent coordination
  #   - Strict regulatory environment that can't tolerate default-on session capture
  federation: per_project           # per_project | org_shared
  # per_project: New CF Worker + D1 + R2 + Vectorize per project (zero coordination tax)
  # org_shared:  Register with an existing org-level archaeology Worker via ALLOWED_PROJECTS
  embed_synthesis: false            # set true if you'll set ANTHROPIC_API_KEY for /derive synthesis
  # When enabled:
  #   - scaffold.sh provisions D1 + R2 + Vectorize and deploys the Worker
  #   - SessionEnd hook copied to ~/.claude/hooks/archaeology-session-end.py
  #   - .github/workflows/archaeology-tail-docs.yml installed
  #   - docs/{inputs,iterations,audits}/ template structure prescribed (Track 1-3 surfaces)

# ──────────────────────────────────────────────────────────────────
# Foundation: Design System + IA — opt-in (wave 74, proposed)
# Reference: template/methodology/design/foundation-stage-spec.md
# Implementation: template/.claude/agents/blueprint/reviewers/foundation-stage-reviewer.md
# ──────────────────────────────────────────────────────────────────

foundation:
  enabled: false                    # set true to activate the Foundation stage
  spec_path: ""                     # optional; relative path to foundation spec doc. Default candidates:
                                    # docs/foundation.md, prototype/foundation.md, blueprint/prototype/foundation.md.
                                    # Declare here for any other location.
  # Use when:
  #   - Initiative is feature-driven (specchain, multi-session feature specs)
  #   - Multi-route authenticated product with nav/layout drift risk
  #   - Midstream/brownfield replatforming where consistency must be enforced
  #   - Project will outlive a single session (no session carries prior layout decisions without this)
  # Skip when:
  #   - Throwaway prototype that won't outlive a week
  #   - Single-purpose single-route deliverable
  #   - No plan for multi-session feature work or specchain

# ──────────────────────────────────────────────────────────────────
# Content voice modes
# ──────────────────────────────────────────────────────────────────

voices:
  strategy: internal-strategy       # "we" voice, scannable, named owners
  feasibility: solution-architecture # precise, code references, open questions
  research: internal-strategy       # evidence-based, pattern → decision mapping
  integration: solution-architecture # code examples, phased rollout
  # If signal_forge.enabled, voice guides at forge-signal/docs/voice/ are authoritative.
  # Blueprint's built-in doc-writer agent uses these same rules independently.

# Prototype configuration
prototype:
  design_system: existing           # existing | bigdesign | custom
  portal_dir: ""                    # optional; relative path from initiative root to the
                                    # Review Portal directory. Default fallback candidates:
                                    # `portal/`, `blueprint/portal/`. Declare here for any
                                    # other location (e.g., rally-hq uses `blueprint/prototype/`
                                    # because the portal predates the canonical Review Portal
                                    # contract). The stamper resolves in priority order:
                                    # --portal-dir CLI flag, this field, then fallback candidates.
                                    # Added 2026-05-27 wave 14 per rally-hq amendment 2026-05-26 gap 1.
  chrome_profile: methodology-themed # methodology-themed | consumer-themed
                                    # Profile A (methodology-themed, default): consumer's brand
                                    # is a thin override on canonical chrome via project-tokens.css.
                                    # shared.css is canonical (byte-identical to template).
                                    # Profile B (consumer-themed, opt-in): consumer owns shared.css
                                    # (design system can drift); canonical primitives in separate
                                    # canonical-primitives.css file. Use when design system is
                                    # named, branded, and load-bearing.
                                    # See docs/methodology/chrome-profile-pattern.md.
                                    # Added 2026-06-27 wave 74 per rally-hq amendment promotion.
  theme: slate                      # slate | coral | forest | minimal | custom
                                    # Multi-theme registry added 2026-05-26 wave 9.

# ──────────────────────────────────────────────────────────────────
# Initiative type — current-state research shape (wave 20, 2026-05-27)
# Added per promo-initiative amendment (wave 17, commit 74fa02f) — the
# wave-17 promotion added the research-prompt + architect-challenge
# docs but no schema field to declare which initiatives need the
# platform-feature treatment. Default consumer-app; existing consumers
# without this field are implicitly consumer-app. References:
#   template/docs/methodology/current-state-research-prompt.md
#   template/docs/methodology/architect-challenge-pattern.md
# Enforcement: research-completeness-reviewer step 8 fires when
# initiative_type = platform-feature.
# ──────────────────────────────────────────────────────────────────

initiative_type: consumer-app       # consumer-app | platform-feature
# consumer-app:    Building a user-facing surface against an existing product.
#                  Stage 1 research inventories existing screens / routes /
#                  flows + competitive UX patterns. (Default; matches the
#                  greenfield consumer-app pipeline the methodology was
#                  originally extracted from.)
# platform-feature: Proposing a new capability the platform itself doesn't
#                   have (new condition type for an existing engine, new
#                   evaluation primitive, new API surface). Stage 1 research
#                   must run the "what needs to be true" frame AND the
#                   architect-challenge pattern; Stage 1 → 2 gate enforces
#                   the existence + completeness of the comparison artifact.
                                    # Each theme overrides --brand-* + --bg + --surface-* tokens in
                                    # template/portal/shared.css [data-theme] blocks. Default = slate.
                                    # `custom` = consumer declares its own [data-theme="custom"] block
                                    # in project-tokens.css (use forge-brand export css to produce shape).
                                    # The stamper writes <html lang="en" data-theme="{theme}"> at scaffold
                                    # time so the default applies before JS loads.
                                    # Runtime switcher (theme-switcher.js) lets stakeholders preview any
                                    # of the 4 themes regardless of consumer's default pick.
                                    #
                                    # Single-axis shorthand: `theme: <name>` is the simple form for
                                    # consumers whose brand model is one chrome theme. For multi-tenant
                                    # or multi-axis brand models, use the brand_axes block below instead.
  brand_axes: []                    # Optional. Long-form schema for multi-axis brand models.
                                    # Default empty = single-axis (use `theme:` above).
                                    # Added 2026-05-27 wave 16 per rally-hq amendment 2026-05-26 §3.
                                    #
                                    # Use when the consumer is multi-tenant or has orthogonal brand
                                    # axes (e.g., Rally HQ: chrome theme (Midnight & Indigo) × per-
                                    # tournament accent (D-family routes get tournament-specific
                                    # --tournament-accent override). The 4-theme registry addresses
                                    # axis 1 only; brand_axes lets the consumer declare additional
                                    # axes the registry has no shape for.
                                    #
                                    # Shape:
                                    #   brand_axes:
                                    #     - id: chrome
                                    #       scope: operator-surface       # which audience/routes this axis applies to
                                    #       source: project-tokens.css    # where the tokens for this axis live
                                    #     - id: tenant-accent
                                    #       scope: tenant-surface
                                    #       source: --tournament-accent runtime CSS variable
                                    #       per_route_override: true       # tenant-side routes set their own value
                                    #
                                    # Methodology consumers of brand_axes (current = documentation
                                    # only; stamp.mjs does not enforce a schema yet; future waves may
                                    # add CLI flags for axis-aware substitution):
                                    #   - chrome-canonical-reviewer can skip files declared as
                                    #     consumer-owned via axis source paths
                                    #   - audit-chrome can interpret expected divergence on files
                                    #     declared as carrying axis content
                                    #
                                    # If brand_axes is non-empty, `theme:` becomes the default for the
                                    # axis with id=chrome (back-compat); explicit per-axis declarations
                                    # in brand_axes override.
  comparison_enabled: true          # show current-state panel (◀ drawer)
  strategy_panel_enabled: true      # show strategy panel (▶ drawer)
  chat_enabled: false               # embed AI chat agent
  deploy_target: vercel             # vercel | cloudflare-pages | static | none
                                    # use "cloudflare-pages" if cloudflare.enabled: true above

# ──────────────────────────────────────────────────────────────────
# Tool-surface clustering — how the tooling around the project deploys
# Reference: docs/patterns/clustered-tool-surface-pattern.md
# ──────────────────────────────────────────────────────────────────
#
# The tooling a project ships (Hive dashboard, prototype, demo storyboard,
# traceability matrix) splits into TWO clusters by auth profile:
#   - operator-internal: things only the team should see (Hive board, etc.)
#   - stakeholder-shareable: things meant to be shared (prototype, demos)
#
# Three modes:
#   - clustered  (default) — one deploy per cluster; recommended for new projects
#   - separate            — each app its own deploy (current blueprint-example pattern)
#   - unified             — single deploy hosting both clusters (rare; auth-gated at top)
#
# See the pattern doc for activation thresholds + retrofit guidance.

tool_surface:
  mode: clustered                   # unified | clustered (recommended) | separate

  operator_cluster:
    enabled: true                   # set false if no operator-internal tooling needed
    auth: cloudflare-access         # cloudflare-access | basic-auth | none
    apps:                           # which apps mount into the operator shell
      hive_dashboard: true
      infra_status: false           # opt-in for state-derive / health dashboards
    deploy_name: ""                 # defaults to <project>-tool-internal

  shareable_cluster:
    enabled: true                   # set false if no public-facing tool surface
    auth: public                    # public | signed-link
    apps:
      prototype: true
      traceability: true
      demos: true
    deploy_name: ""                 # defaults to <project>-tool-public

# Research scope
research:
  competitors: []                   # e.g., ["Shopify", "Squarespace"]
  analogous_industries: []          # e.g., ["utility billing", "telecom"]
  codebase_path: ""                 # path to production repo for feasibility validation
  screenshots_path: ""              # path to current-state screenshots

# Document package
documents:
  - type: strategy
    title: ""
    audience: leadership
  - type: feasibility
    title: ""
    audience: engineering
  # - type: research
  # - type: integration

# Stateful artifact pairs — registry-view synchronization gates
# Reference: docs/patterns/stateful-registry-sync-pattern.md
#           template/.claude/agents/blueprint/reviewers/roadmap-registry-sync-reviewer.md
# Enforcement: roadmap-registry-sync-reviewer runs on every `doctor` check (CI gate).
# ──────────────────────────────────────────────────────────────────────────────────────
#
# Registers pairs of artifacts for mechanical sync verification: a registry
# (YAML/JSON, machine-readable status) paired with a view (Markdown narrative).
# Four checks per pair: (a) every planned/in-progress item must appear in view;
# (b) no shipped items can be listed in the build section; (c) every item-id
# the view references must exist in registry; (d) item ids must be unique.
#
# Default pair (when stateful_pairs absent): prescription.yml ↔ docs/roadmap.md
# if both exist. Can be overridden by declaring stateful_pairs below. Declare
# any non-default paths here (registry_file: "path", view_file: "path").
#
# Why this gate exists: on 2026-06-11 rally-hq's roadmap drifted silently while
# 12 arcs shipped, advisory rules never caught it, and every instance was caught
# by operators, not gates. Hardcoded status in plans rots without mechanical
# enforcement. Second-instance candidates: any consumer whose portal serves a
# roadmap/plan doc next to a statused prescription (website-nc-v3,
# blueprint-redesign both stamp the pair).

stateful_pairs:
  # - registry: prescription.yml        # YAML file path; supports custom JSON paths
  #   view: docs/roadmap.md             # Markdown file path; tables are scanned for item-ids

# Quality gates
quality:
  audit_before_share: true          # run four-check audit before generating deliverables
  fact_check_against_code: true     # validate claims against codebase if path provided
  cite_sources: true                # require citations in research doc
