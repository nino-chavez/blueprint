# Blueprint Configuration
# Copy this to your initiative root and customize.

project:
  name: ""                          # e.g., "Self-Service Billing Portal"
  description: ""                   # One-line description of the initiative
  product: ""                       # e.g., "BigCommerce BMP"
  audience:
    leadership: []                  # e.g., ["Daniel Lentz", "Austin Comer"]
    engineering: []                 # e.g., ["BMP team"]
    broader: []                     # e.g., ["All stakeholders"]

# ──────────────────────────────────────────────────────────────────
# Pilot profile (REQUIRED — Stage 0 → Stage 1 gate)
# Reference: docs/methodology/pilot-profile-template.md
# Reviewer:  pilot-profile-lock-reviewer (blocks Stage 1 until this is filled)
# ──────────────────────────────────────────────────────────────────
#
# Why this is required: on 2026-05-22 (rally-hq vs-volleyballlife walkthrough)
# an initiative drifted from its declared pilot ("competitive scan against
# vs-volleyballlife") to a different pilot ("Let's Pepper feature comparison")
# without the operator noticing — because the original pilot was never locked
# in a structured field. Stage 1 research went deep on the wrong target.
#
# The lock prevents implicit pilot substitution. Stage 1 research must derive
# from this profile; any pivot to a different pilot requires an explicit ADR.
pilot_profile:
  slug: ""                          # short id, e.g., "tournament-organizer"
  display_name: ""                  # e.g., "Tournament Organizer (regional, multi-court)"
  pain_point: ""                    # one-sentence specific pain this initiative addresses
  monetization_side: ""             # player | coach | organizer | buyer | seller | operator | (other — name it)
  walkthrough_citation: ""          # path to a real artifact: interview transcript, competitive
                                    # walkthrough doc, observation notes, screenshot set. NOT
                                    # "I imagined this user." A real artifact you can cite.
  competitors_in_scope: []          # competitors derived FROM this pilot, not arbitrary picks
                                    # e.g., ["VolleyballLife.com", "AdvancedEventSystems", "Let's Pepper"]
  out_of_scope_pilots: []           # other pilots the initiative could have targeted but won't
                                    # naming them prevents accidental drift
                                    # e.g., ["Player searching for team", "Coach managing roster"]

# Execution depth
execution:
  depth: standard                   # lean | standard | thorough
  # lean:     Research + prototype + 1 strategy doc. Fast alignment.
  # standard: Research + prototype + strategy + feasibility docs. Full pipeline.
  # thorough: All of standard + market comparables + integration plan + AI chat + codebase validation.

# ──────────────────────────────────────────────────────────────────
# Optional dependencies
# Blueprint works standalone. These tools extend it.
# ──────────────────────────────────────────────────────────────────

# Signal Forge — strategic content generation with voice taxonomy
# Install: git clone git@github.com:nino-chavez/signal-forge.git && cd signal-forge && npm install
# Docs: https://github.com/nino-chavez/signal-forge
signal_forge:
  enabled: false                    # set true if signal-forge is available
  path: ""                          # e.g., "~/Workspace/dev/tools/signal-forge"
  # When enabled:
  #   - /blueprint-docs can use signal-forge's generate command for thought-leadership voice
  #   - Voice guides at signal-forge/docs/voice/ are the canonical reference
  #   - Document quality audit at signal-forge/docs/voice/document-quality-audit.md

# Specchain — spec-driven development with multi-agent orchestration
# Install: git clone git@github.com:nino-chavez/specchain.git && cd specchain && bash setup.sh
# Docs: https://github.com/nino-chavez/specchain
specchain:
  enabled: false                    # set true if specchain is installed in this project
  # When enabled:
  #   - /blueprint-prototype can hand off to specchain for implementation specs
  #   - Governance principles from specchain/governance/principles.md apply
  #   - STATE.md session tracking pattern is available
  #   - Squad mode agents can parallelize research tasks

# ──────────────────────────────────────────────────────────────────
# BigCommerce B2B Edition — opt-in for B2B-targeted initiatives
# Reference: docs/bc-b2b-edition-context.md
#            docs/bc-b2b-buyer-portal-integration.md
# ──────────────────────────────────────────────────────────────────

b2b_edition:
  enabled: false                    # set true if initiative targets BC B2B Edition
  # When enabled:
  #   - Stage 1 research auto-includes both BC B2B reference docs in research/current-state/
  #   - prototype/DESIGN.md "When Targeting BC B2B Edition" section is authoritative
  #   - CLAUDE.md adds B2B-specific anti-patterns and reading order
  #   - Strategy panels must cite Buyer Portal contract methods (loginWithB2B, useAddToQuote, on-cart-created, etc.)
  buyer_portal_strategy: bc_cdn     # bc_cdn | fork | host_owned
  # bc_cdn:     Use BC's hosted Buyer Portal SPA (default, zero infra)
  # fork:       Fork bigcommerce/b2b-buyer-portal, self-host (when surface customization is unavoidable)
  # host_owned: Implement Buyer-Portal-equivalent surfaces in your host storefront (rare; usually overkill)

# ──────────────────────────────────────────────────────────────────
# Hive multi-agent coordination — opt-in
# Reference: docs/hive-coordination-pattern.md
# ──────────────────────────────────────────────────────────────────

hive:
  enabled: false                    # set true to bootstrap Hive on a dedicated CF account
  source: ""                        # e.g., "~/Workspace/dev/wip/bc-subscriptions/.hive"
  mcp_server: ""                    # e.g., "myproject-hive-mcp"
  dashboard: ""                     # e.g., "myproject-hive-dashboard"
  cf_account: ""                    # CF account binding (named profile or account ID)
  d1_database: ""                   # e.g., "myproject-hive-d1"
  # Use when:
  #   - 5+ parallelizable work streams
  #   - Multiple agent sessions running concurrently against the same repo
  #   - Timeline too short for serialized work (<2 weeks)
  # Skip when:
  #   - Solo, sequential initiative — TaskCreate is sufficient
  #   - Throwaway exploration

# ──────────────────────────────────────────────────────────────────
# Cloudflare deployment — opt-in (replaces default Vercel target)
# Reference: docs/cloudflare-deployment-pattern.md
# ──────────────────────────────────────────────────────────────────

cloudflare:
  enabled: false                    # set true to deploy on Cloudflare instead of Vercel
  # When enabled:
  #   - Stage 6 deploy uses `wrangler deploy` / `wrangler pages deploy`
  #   - Stage 1 research auto-includes cloudflare-deployment-pattern.md
  #   - ADR-0004 pattern (CF infrastructure inventory) is mandatory before code is written
  account_strategy: single          # single | per_environment
  # single:          One CF account, multiple envs via wrangler [env.*] (fastest setup)
  # per_environment: Separate CF accounts per env (production isolation)
  primitives:                       # Which CF primitives the initiative will use
    workers: true
    pages: true
    d1: false
    workers_ai: false
    vectorize: false
    kv: false
    r2: false
    queues: false
    durable_objects: false

# ──────────────────────────────────────────────────────────────────
# OWNER-SPEC pattern — durable expert knowledge on substrate tools
# Reference: ~/Workspace/dev/tools/blueprint/docs/owner-spec-pattern.md
# Implementation: template/tools/owner-spec-lint/ + template/docs/methodology/owner-spec-convention.md
# ──────────────────────────────────────────────────────────────────

owner_spec:
  enabled: false                    # set true to inherit the OWNER-SPEC convention + freshness lint
  # Use when:
  #   - Project has >3 substrate tools (derive scripts, lint tools, dashboards, ingesters)
  #   - Multi-session / multi-agent work expected (future sessions need rationale)
  #   - Tools accumulate design decisions that aren't obvious from code
  #   - You plan to build skill-mediated expert agents at any point
  # Skip when:
  #   - Project has only trivial scripts (<50 LOC each, fully README-documented)
  #   - One-shot prototype with no substrate tools
  #   - You're OK with re-deriving tool design rationale six months from now

# ──────────────────────────────────────────────────────────────────
# Archaeology substrate — opt-in (recommended for >2-week initiatives)
# Reference: docs/archaeology-substrate-pattern.md
# Implementation: template/tools/archaeology/  (scaffold.sh provisions everything)
# ──────────────────────────────────────────────────────────────────

archaeology:
  enabled: false                    # set true to bootstrap the substrate at project init
  project_slug: ""                  # short name; used in CF resource names (e.g. "subs", "askbc")
  project_id: ""                    # full project id; usually matches `project.name`
  # Use when:
  #   - Initiative will run more than a few weeks (history accumulates)
  #   - Multi-agent / multi-session work expected (sessions are highest-value stream)
  #   - Onboarding new engineers periodically (the substrate turns "write a handoff doc" into "run a query")
  #   - You want exhaustive provenance queryable as evidence (due-diligence framing)
  # Skip when:
  #   - Throwaway prototype that won't outlive the week
  #   - Solo, single-session work with no Hive or multi-agent coordination
  #   - Strict regulatory environment that can't tolerate default-on session capture
  federation: per_project           # per_project | org_shared
  # per_project: New CF Worker + D1 + R2 + Vectorize per project (zero coordination tax)
  # org_shared:  Register with an existing org-level archaeology Worker via ALLOWED_PROJECTS
  embed_synthesis: false            # set true if you'll set ANTHROPIC_API_KEY for /derive synthesis
  # When enabled:
  #   - scaffold.sh provisions D1 + R2 + Vectorize and deploys the Worker
  #   - SessionEnd hook copied to ~/.claude/hooks/archaeology-session-end.py
  #   - .github/workflows/archaeology-tail-docs.yml installed
  #   - docs/{inputs,iterations,audits}/ template structure prescribed (Track 1-3 surfaces)

# ──────────────────────────────────────────────────────────────────
# Content voice modes
# ──────────────────────────────────────────────────────────────────

voices:
  strategy: internal-strategy       # "we" voice, scannable, named owners
  feasibility: solution-architecture # precise, code references, open questions
  research: internal-strategy       # evidence-based, pattern → decision mapping
  integration: solution-architecture # code examples, phased rollout
  # If signal_forge.enabled, voice guides at signal-forge/docs/voice/ are authoritative.
  # Blueprint's built-in doc-writer agent uses these same rules independently.

# Prototype configuration
prototype:
  design_system: existing           # existing | bigdesign | custom
  theme: slate                      # slate | coral | forest | minimal | custom
                                    # Multi-theme registry added 2026-05-26 wave 9.
                                    # Each theme overrides --brand-* + --bg + --surface-* tokens in
                                    # template/portal/shared.css [data-theme] blocks. Default = slate.
                                    # `custom` = consumer declares its own [data-theme="custom"] block
                                    # in project-tokens.css (use forge-brand export css to produce shape).
                                    # The stamper writes <html lang="en" data-theme="{theme}"> at scaffold
                                    # time so the default applies before JS loads.
                                    # Runtime switcher (theme-switcher.js) lets stakeholders preview any
                                    # of the 4 themes regardless of consumer's default pick.
  comparison_enabled: true          # show current-state panel (◀ drawer)
  strategy_panel_enabled: true      # show strategy panel (▶ drawer)
  chat_enabled: false               # embed AI chat agent
  deploy_target: vercel             # vercel | cloudflare-pages | static | none
                                    # use "cloudflare-pages" if cloudflare.enabled: true above

# ──────────────────────────────────────────────────────────────────
# Tool-surface clustering — how the tooling around the project deploys
# Reference: docs/clustered-tool-surface-pattern.md
# ──────────────────────────────────────────────────────────────────
#
# The tooling a project ships (Hive dashboard, prototype, demo storyboard,
# traceability matrix) splits into TWO clusters by auth profile:
#   - operator-internal: things only the team should see (Hive board, etc.)
#   - stakeholder-shareable: things meant to be shared (prototype, demos)
#
# Three modes:
#   - clustered  (default) — one deploy per cluster; recommended for new projects
#   - separate            — each app its own deploy (current bc-subscriptions pattern)
#   - unified             — single deploy hosting both clusters (rare; auth-gated at top)
#
# See the pattern doc for activation thresholds + retrofit guidance.

tool_surface:
  mode: clustered                   # unified | clustered (recommended) | separate

  operator_cluster:
    enabled: true                   # set false if no operator-internal tooling needed
    auth: cloudflare-access         # cloudflare-access | basic-auth | none
    apps:                           # which apps mount into the operator shell
      hive_dashboard: true
      infra_status: false           # opt-in for state-derive / health dashboards
    deploy_name: ""                 # defaults to <project>-tool-internal

  shareable_cluster:
    enabled: true                   # set false if no public-facing tool surface
    auth: public                    # public | signed-link
    apps:
      prototype: true
      traceability: true
      demos: true
    deploy_name: ""                 # defaults to <project>-tool-public

# Research scope
research:
  competitors: []                   # e.g., ["Shopify", "Squarespace"]
  analogous_industries: []          # e.g., ["utility billing", "telecom"]
  codebase_path: ""                 # path to production repo for feasibility validation
  screenshots_path: ""              # path to current-state screenshots

# Document package
documents:
  - type: strategy
    title: ""
    audience: leadership
  - type: feasibility
    title: ""
    audience: engineering
  # - type: research
  # - type: integration

# Quality gates
quality:
  audit_before_share: true          # run four-check audit before generating deliverables
  fact_check_against_code: true     # validate claims against codebase if path provided
  cite_sources: true                # require citations in research doc
