    kind: human
    evidence: { status: intrinsic }
    outcomes:
      - id: recover-context
        success:
          statement: resume methodology work without re-deriving wave state
          proof:
            target: { method: observed-human, signal: operator resumes at the current wave without re-derivation }
            interim: { method: cold-agent, signal: session reaches current wave + open threads from WAVE-LOG tail }
  - id: next-agent
    kind: agent
    evidence: { status: intrinsic }
    outcomes:
      - id: bootstrap
        success:
          statement: boot with canonical methodology context
          proof:
            target: { method: cold-agent, signal: SessionStart inject suffices without re-reading METHODOLOGY.md }
  - id: casual-visitor
    kind: human
    evidence: { status: observed, source: feedback/2026-06-09-casual-visitor.md }   # first cold walk
    outcomes:
      - id: orient
        success:
          statement: can say what Blueprint is and whether it's for them, one scroll, sub-60s
          proof:
            target: { method: observed-human, signal: cold-open narrate test passes (P4 re-test, pending) }
            interim: { method: simulated-walk, signal: persona-walk agent orients from the hero alone }
  - id: evaluating-team-lead
    kind: human
    evidence: { status: observed, source: docs/content/validation-script.md }       # Mom-test ledger
    outcomes:
      - id: evaluate
        success:
          statement: knows what a trial costs, what they keep if they quit, what evidence says it works beyond the author
          proof:
            target: { method: observed-human, signal: a commitment-class ask taken (time/reputation per Mom-test ledger) }
  - id: contributor
    kind: human
    evidence: { status: assumed }             # A5: zero external amendments to date — honest status
