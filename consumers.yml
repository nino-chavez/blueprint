# (additive, optional fields default to prior behavior), so consumers are safe at
# 0.4.0 without re-stamping. AUTHORITATIVE per-consumer pins (each blueprint.yml)
# are rolling out as each repo commits; this mirror is bumped per-row only as the
# consumer's own pin is committed (rally-hq, atelier, photography done 2026-06-26 —
# their blueprint.yml pins committed locally, pending each repo's own push). Rows
# still at 0.3.0/null have their authoritative-pin commit pending their repo's next
# push (dormant/unpinned consumers left until next active per operator direction).

